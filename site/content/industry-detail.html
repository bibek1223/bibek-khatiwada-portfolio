<section class="ind-detail-section">
  <div class="wrap ind-detail-layout">
    <article class="ind-main">
      <h2>Verified Sector Niches</h2>
      <div class="niche-cloud">
        {{niches_cloud}}
      </div>

      <h2 style="margin-top:2.5rem">Industry Pain Points &amp; Search Bottlenecks</h2>
      <ul class="pain-list">
        {{pain_points_list}}
      </ul>

      <h2 style="margin-top:2.5rem">Custom Search Blueprint &amp; Technical Approach</h2>
      <div class="ind-approach">
        {{approach_html}}
      </div>

      <h2 style="margin-top:2.5rem">Relevant Search Console Case Studies</h2>
      <div class="cs-grid">
        {{related_cases}}
      </div>
    </article>

    <aside class="ind-side">
      <div class="side-card">
        <div class="mini-note">Sector Focus</div>
        <h3>{{title}}</h3>
        <p class="tiny">{{summary}}</p>
        <a class="btn btn-primary" href="{{root}}contact/?industry={{slug}}" style="margin-top:1rem">Get Sector Strategy →</a>
      </div>
    </aside>
  </div>
</section>
